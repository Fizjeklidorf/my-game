<!DOCTYPE html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Does building abilities from parts in the Forge feel like inventing, so players keep returning to tweak them? -->
<!-- Date: 2026-10-29 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ability Forge Prototype</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #121418; color: #d8dbe2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #forge { position: absolute; inset: 0; overflow: auto; padding: 16px 20px; }
  #forge h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 1px; }
  #forge h2 { font-size: 15px; margin: 0 0 8px; color: #f0e2b6; }
  #forge h3 { font-size: 13px; margin: 12px 0 4px; color: #9aa3b2; text-transform: uppercase; letter-spacing: 1px; }
  .top { display: flex; gap: 20px; align-items: baseline; }
  .xp { font-size: 18px; color: #ffe9a8; }
  .muted { color: #7f8796; font-size: 12px; }
  .cols { display: flex; gap: 16px; margin-top: 10px; align-items: flex-start; }
  .col { background: #1b1e24; border: 1px solid #2a2f38; border-radius: 6px; padding: 12px; }
  .c1 { flex: 1.1; } .c2 { flex: 1.3; } .c3 { flex: 0.8; }
  .ab { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid #262a33; }
  .ab canvas { flex: none; border-radius: 4px; }
  .lv { color: #ffe9a8; font-size: 12px; }
  label.opt { display: block; padding: 3px 0; cursor: pointer; }
  label.opt.locked { color: #555c69; cursor: not-allowed; }
  button { background: #2a2f39; color: #d8dbe2; border: 1px solid #3a404c; border-radius: 4px; padding: 3px 8px; margin: 2px 2px 0 0; cursor: pointer; font-size: 12px; }
  button:hover:not(:disabled) { border-color: #f0e2b6; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.on { background: #4a3f20; border-color: #f0e2b6; }
  button.big { font-size: 14px; padding: 7px 12px; margin-top: 6px; width: 100%; }
  input[type=text] { background: #121418; color: #fff; border: 1px solid #3a404c; padding: 4px 6px; width: 100%; border-radius: 4px; }
  select { background: #121418; color: #fff; border: 1px solid #3a404c; }
  #preview { background: #121418; border-radius: 4px; display: block; margin: 8px 0; width: 100%; }
  .stats { font-variant-numeric: tabular-nums; color: #c9cfda; }
  .slot { padding: 4px 0; }
  canvas#c { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #1b1e24; cursor: crosshair; }
  #overlay { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #1b1e24ee; border: 1px solid #f0e2b6; border-radius: 8px; padding: 18px 22px; min-width: 360px; max-width: 640px; z-index: 5; }
  #overlay h2 { margin-top: 0; color: #f0e2b6; }
  #tally { display: none; position: absolute; right: 12px; top: 12px; width: 380px; max-height: 90vh; overflow: auto; background: #0e0f12f2; border: 1px solid #555; border-radius: 6px; padding: 12px; z-index: 6; font-size: 12px; }
  #tally textarea { width: 100%; height: 220px; background: #000; color: #9fe; font: 11px monospace; }
  #toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); color: #7fd8ff; font-size: 18px; z-index: 7; pointer-events: none; text-shadow: 0 0 8px #000; }
</style>
</head>
<body>
<div id="forge"></div>
<canvas id="c" width="1000" height="640"></canvas>
<div id="overlay"></div>
<div id="tally"></div>
<div id="toast"></div>
<script>
// PROTOTYPE - NOT FOR PRODUCTION
// Question: Does building abilities from parts in the Forge feel like inventing, so players keep returning to tweak them?
// Date: 2026-10-29

const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1000, H = 640;
const COL = { energy: '#ffe9a8', frost: '#7fd8ff' };
const RED = '#ff4d3d', AMBER = '#ffb02e';
const KEYN = ['LMB', 'RMB', 'Q', 'E'];

// Blueprints: shape is fixed per blueprint (visual rule: shape = blueprint, colour = element)
const BP = {
  bolt:   { name: 'Bolt',   desc: 'fast line, low damage',            dmg: 12, cost: 8,  cd: 0.22, speed: 660, r: 4,  life: 1.4, kind: 'proj' },
  ball:   { name: 'Ball',   desc: 'slow sphere, bursts in an area',   dmg: 22, cost: 18, cd: 0.7,  speed: 300, r: 10, life: 2.4, aoe: 70, kind: 'proj' },
  beam:   { name: 'Beam',   desc: 'instant column, hits everything in line', dmg: 26, cost: 22, cd: 0.9, len: 460, w: 12, kind: 'beam' },
  shield: { name: 'Shield', desc: 'plane in front of you, blocks shots, burns touch', dmg: 7, cost: 24, cd: 4, dur: 2.6, len: 42, kind: 'shield' }
};

// ---------- persistent session state ----------
const S = { xp: 60, forged: 0, abilities: [], slots: [null, null, null, null], frost: false, nextId: 1, wave: 1 };
const T = { forgeVisits: 0, newForged: 0, reforges: 0, grows: 0, renames: 0, equips: 0, fights: 0, retreats: 0, deaths: 0,
            bossTries: 0, bossKills: 0, practice: 0, signatures: new Set(), tForge: 0, tFight: 0, log: [], start: performance.now() };
function clock() { const s = (performance.now() - T.start) / 1000 | 0; return String(s / 60 | 0).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function tlog(m) { T.log.push(clock() + '  ' + m); }

function forgeCost() { return Math.round(15 * Math.pow(1.3, S.forged)); } // escalates exponentially with each new ability
const REFORGE_COST = 5;
function growCost(a) { return Math.round(12 * Math.pow(a.level, 1.6)); }

function stats(a) {
  const b = BP[a.bp];
  let dmg = b.dmg * (1 + 0.15 * ((a.level || 1) - 1)), cost = b.cost, cd = b.cd;
  if (a.split) { dmg *= 0.6; cost *= 1.6; }
  if (a.charge) { cost *= 1.2; cd *= 1.2; }
  if (a.chain) { cost *= 1.3; }
  if (a.el === 'frost') { dmg *= 0.85; }
  return { dmg, cost, cd };
}
function sig(a) { return [a.bp, a.split ? 'S' : '-', a.charge ? 'C' : '-', a.chain ? 'K:' + a.chainBp : '-', a.el].join('|'); }
function recipe(a) {
  const p = [a.el === 'frost' ? 'Frost' : 'Energy', BP[a.bp].name];
  if (a.split) p.push('+Split'); if (a.charge) p.push('+Charge'); if (a.chain) p.push('⟶ ' + BP[a.chainBp].name);
  return p.join(' ');
}
function autoName(d) {
  const parts = [];
  parts.push(d.el === 'frost' ? 'Frost' : 'Energy');
  if (d.charge) parts.push('Charged');
  if (d.split) parts.push('Split');
  parts.push(BP[d.bp].name);
  let n = parts.join(' ');
  if (d.chain) n += ' → ' + BP[d.chainBp].name;
  return n;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// starter ability: a pre-made class's basic attack, built from a blueprint
S.abilities.push({ id: S.nextId++, name: 'Energy Bolt', bp: 'bolt', split: false, charge: false, chain: false, chainBp: 'ball', el: 'energy', level: 1 });
S.slots[0] = 1;

function newDraft() { return { editingId: null, bp: 'ball', split: false, charge: false, chain: false, chainBp: 'bolt', el: 'energy', name: '', nameTouched: false }; }
let draft = newDraft();
let mode = 'forge';

// ---------- shape drawing (shared by forge icons and arena) ----------
function glow(ctx, col, blur) { ctx.shadowColor = col; ctx.shadowBlur = blur; }
function drawShape(ctx, bp, x, y, ang, sc, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); glow(ctx, col, 12); ctx.strokeStyle = col; ctx.fillStyle = col;
  if (bp === 'bolt') { ctx.lineWidth = 3 * sc; ctx.beginPath(); ctx.moveTo(-14 * sc, 0); ctx.lineTo(10 * sc, 0); ctx.stroke(); }
  else if (bp === 'ball') { ctx.beginPath(); ctx.arc(0, 0, 9 * sc, 0, 7); ctx.fill(); }
  else if (bp === 'beam') { ctx.globalAlpha = 0.85; ctx.fillRect(0, -4 * sc, 54 * sc, 8 * sc); }
  else if (bp === 'shield') { ctx.lineWidth = 5 * sc; ctx.beginPath(); ctx.moveTo(0, -16 * sc); ctx.lineTo(0, 16 * sc); ctx.stroke(); }
  ctx.restore();
}
function drawIcon(ctx, a, w, h) {
  ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#121418'; ctx.fillRect(0, 0, w, h);
  const col = COL[a.el], sc = Math.min(w / 120, h / 50) * (w > 200 ? 1.4 : 1);
  const ox = w * 0.18, oy = h / 2, mainX = a.chain ? w * 0.36 : w * 0.45;
  if (a.charge) { ctx.save(); glow(ctx, col, 8); ctx.strokeStyle = col; for (let i = 1; i <= 3; i++) { ctx.globalAlpha = 0.5 / i; ctx.beginPath(); ctx.arc(ox, oy, 6 * i * sc, 0, 7); ctx.stroke(); } ctx.restore(); }
  const angs = a.split ? (a.bp === 'shield' ? [0, 2.09, 4.19] : [-0.35, 0, 0.35]) : [0];
  for (const g of angs) {
    if (a.bp === 'shield' && a.split) drawShape(ctx, 'shield', mainX + Math.cos(g) * 16 * sc, oy + Math.sin(g) * 16 * sc, g, sc * 0.7, col);
    else drawShape(ctx, a.bp, mainX + Math.cos(g) * 8 * sc - 8 * sc, oy + Math.sin(g) * 22 * sc, g, sc, col);
  }
  if (a.chain) {
    ctx.save(); ctx.strokeStyle = '#9aa3b2'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(w * 0.58, oy); ctx.lineTo(w * 0.74, oy); ctx.stroke(); ctx.restore();
    drawShape(ctx, a.chainBp, w * 0.84, oy, 0, sc * 0.7, col);
  }
}

// ---------- forge UI ----------
function nameOf(id) { const a = S.abilities.find(x => x.id === id); return a ? a.name : '?'; }
function renderForge() {
  const d = draft;
  if (!d.nameTouched) d.name = autoName(d);
  const st = stats({ ...d, level: d.editingId ? S.abilities.find(a => a.id === d.editingId).level : 1 });
  const radio = (grp, val, label, locked) =>
    `<label class="opt ${locked ? 'locked' : ''}"><input type="radio" name="${grp}" ${d[grp] === val ? 'checked' : ''} ${locked ? 'disabled' : ''} onchange="setDraft('${grp}','${val}')"> ${label}</label>`;
  const check = (k, label) => `<label class="opt"><input type="checkbox" ${d[k] ? 'checked' : ''} onchange="setDraft('${k}',this.checked)"> ${label}</label>`;
  const fc = forgeCost();
  const action = d.editingId
    ? `<button class="big" onclick="saveEdit()" ${S.xp < REFORGE_COST ? 'disabled' : ''}>Save changes (${REFORGE_COST} XP)</button><button class="big" onclick="cancelEdit()">Stop editing</button>`
    : `<button class="big" onclick="forgeNew()" ${S.xp < fc ? 'disabled' : ''}>Forge new ability (${fc} XP)</button>`;
  document.getElementById('forge').innerHTML = `
  <div class="top"><h1>THE FORGE</h1><span class="xp">XP ${S.xp | 0}</span>
    <span class="muted">New abilities cost more each time you forge one. Editing an existing one is cheap. Take as long as you like.</span></div>
  <div class="cols">
    <div class="col c1"><h2>Your abilities</h2>
      ${S.abilities.map(a => `<div class="ab"><canvas class="icon" data-id="${a.id}" width="120" height="50"></canvas>
        <div><b>${esc(a.name)}</b> <span class="lv">Lv ${a.level}</span><br><span class="muted">${recipe(a)}</span><br>
        <button onclick="editAb(${a.id})">Edit</button>
        <button onclick="grow(${a.id})" ${S.xp < growCost(a) ? 'disabled' : ''}>Grow +15% (${growCost(a)} XP)</button><br>
        Equip: ${[0, 1, 2, 3].map(i => `<button class="${S.slots[i] === a.id ? 'on' : ''}" onclick="equip(${a.id},${i})">${KEYN[i]}</button>`).join('')}
        </div></div>`).join('')}
    </div>
    <div class="col c2"><h2>${d.editingId ? 'Editing: ' + esc(nameOf(d.editingId)) : 'Blueprint table: new ability'}</h2>
      <h3>Blueprint</h3>${Object.keys(BP).map(k => radio('bp', k, `<b>${BP[k].name}</b>: <span class="muted">${BP[k].desc}</span>`)).join('')}
      <h3>Alterations</h3>
      ${check('split', 'Split: three at once, each weaker')}
      ${check('charge', 'Charge: hold to power up, release to cast')}
      ${check('chain', 'Chain: on hit, a second stage fires from the impact point')}
      <div style="margin-left:22px">Second stage: <select onchange="setDraft('chainBp',this.value)" ${d.chain ? '' : 'disabled'}>
        ${['bolt', 'ball', 'beam'].map(k => `<option value="${k}" ${d.chainBp === k ? 'selected' : ''}>${BP[k].name}</option>`).join('')}</select></div>
      <h3>Element</h3>
      ${radio('el', 'energy', 'Energy: neutral white-gold')}
      ${radio('el', 'frost', S.frost ? 'Frost: slows what it hits, slightly less damage' : 'Frost: undiscovered (an elite enemy carries a shard)', !S.frost)}
      <canvas id="preview" width="420" height="110"></canvas>
      <div class="stats">Damage ${st.dmg.toFixed(1)}${d.split ? ' ×3' : ''}${d.charge ? ' (up to ×2.5 charged)' : ''}${d.chain ? ' + stage' : ''} · Energy ${st.cost | 0} · Cooldown ${st.cd.toFixed(2)}s</div>
      <h3>Name</h3><input type="text" id="nm" value="${esc(d.name)}" oninput="draft.name=this.value;draft.nameTouched=true">
      ${action}
    </div>
    <div class="col c3"><h2>Loadout</h2>
      ${[0, 1, 2, 3].map(i => `<div class="slot"><b>${KEYN[i]}</b>: ${S.slots[i] ? esc(nameOf(S.slots[i])) : '<span class="muted">empty</span>'}</div>`).join('')}
      <h2 style="margin-top:14px">Go fight</h2>
      <button class="big" onclick="startFight('waves')">Waves (next: wave ${S.wave})</button>
      <button class="big" onclick="startFight('boss')">The Warden (boss)</button>
      <button class="big" onclick="startFight('practice')">Practice dummy</button>
      <p class="muted">In a fight: WASD to move, aim with the mouse, LMB / RMB / Q / E to cast. Press F any time to come back here. You keep all XP you earn, even if you fall.</p>
      <p class="muted">Observer: press L for the session tally.</p>
    </div>
  </div>`;
  document.querySelectorAll('canvas.icon').forEach(cv => drawIcon(cv.getContext('2d'), S.abilities.find(a => a.id === +cv.dataset.id), cv.width, cv.height));
  const pv = document.getElementById('preview'); drawIcon(pv.getContext('2d'), d, pv.width, pv.height);
}
function setDraft(k, v) { draft[k] = v; renderForge(); }
function forgeNew() {
  const c = forgeCost(); if (S.xp < c) return;
  S.xp -= c; S.forged++;
  const a = { id: S.nextId++, name: draft.name.trim() || autoName(draft), bp: draft.bp, split: draft.split, charge: draft.charge, chain: draft.chain, chainBp: draft.chainBp, el: draft.el, level: 1 };
  S.abilities.push(a); T.newForged++; T.signatures.add(sig(a));
  const empty = S.slots.indexOf(null); if (empty >= 0) S.slots[empty] = a.id;
  tlog(`FORGED "${a.name}" [${recipe(a)}] for ${c} XP`);
  draft.nameTouched = false; renderForge();
}
function editAb(id) {
  const a = S.abilities.find(x => x.id === id);
  draft = { editingId: id, bp: a.bp, split: a.split, charge: a.charge, chain: a.chain, chainBp: a.chainBp, el: a.el, name: a.name, nameTouched: true };
  renderForge();
}
function saveEdit() {
  if (S.xp < REFORGE_COST) return;
  const a = S.abilities.find(x => x.id === draft.editingId);
  const before = recipe(a), oldName = a.name;
  Object.assign(a, { bp: draft.bp, split: draft.split, charge: draft.charge, chain: draft.chain, chainBp: draft.chainBp, el: draft.el, name: draft.name.trim() || autoName(draft) });
  S.xp -= REFORGE_COST; T.reforges++; T.signatures.add(sig(a));
  if (a.name !== oldName) T.renames++;
  tlog(`REFORGED "${oldName}" [${before}] -> "${a.name}" [${recipe(a)}]`);
  draft = newDraft(); renderForge();
}
function cancelEdit() { draft = newDraft(); renderForge(); }
function grow(id) {
  const a = S.abilities.find(x => x.id === id), c = growCost(a); if (S.xp < c) return;
  S.xp -= c; a.level++; T.grows++; tlog(`GREW "${a.name}" to Lv ${a.level} for ${c} XP`); renderForge();
}
function equip(id, i) { S.slots[i] = S.slots[i] === id ? null : id; T.equips++; tlog(`EQUIP ${KEYN[i]} = ${S.slots[i] ? nameOf(id) : 'empty'}`); renderForge(); }

// ---------- fight state ----------
let P, enemies, shots, eshots, fx, nums, shields, pickups, keys = {}, mouse = { x: W / 2, y: H / 2, b: [false, false] }, fightMode, paused, cds, charging, dps;
function startFight(m) {
  if (!S.slots.some(s => s)) { toast('Equip an ability first'); return; }
  fightMode = m; mode = 'fight'; paused = false; T.fights++;
  if (m === 'boss') T.bossTries++; if (m === 'practice') T.practice++;
  tlog(`FIGHT ${m === 'waves' ? 'wave ' + S.wave : m} with [${S.slots.map((s, i) => KEYN[i] + ':' + (s ? nameOf(s) : '-')).join(', ')}]`);
  P = { x: W / 2, y: H / 2 + 120, r: 12, hp: 100, maxhp: 100, en: 100, lastHit: '', flash: 0 };
  enemies = []; shots = []; eshots = []; fx = []; nums = []; shields = []; pickups = []; cds = [0, 0, 0, 0]; charging = [null, null, null, null]; dps = [];
  if (m === 'waves') spawnWave(S.wave);
  else if (m === 'boss') enemies.push(mkEnemy('boss', W / 2, 140));
  else enemies.push(mkEnemy('dummy', W / 2, 200));
  document.getElementById('forge').style.display = 'none'; C.style.display = 'block'; hideOverlay();
}
function backToForge(reason) {
  mode = 'forge'; T.forgeVisits++; if (reason === 'retreat') T.retreats++;
  tlog(`BACK TO FORGE (${reason})`);
  C.style.display = 'none'; document.getElementById('forge').style.display = 'block'; hideOverlay(); renderForge();
}
const ET = {
  grunt:   { r: 14, hp: 40,   spd: 95, xp: 4,  col: '#7d828c', reach: 34, tell: 0.55, dmg: 12, label: 'Grunt lunge (red flash)' },
  spitter: { r: 12, hp: 32,   spd: 75, xp: 6,  col: '#8c8678', tell: 0.8, dmg: 9, label: 'Spitter shot (amber flash)' },
  elite:   { r: 22, hp: 240,  spd: 80, xp: 25, col: '#9a8f7a', reach: 70, tell: 0.75, dmg: 20, label: 'Elite slam (red ring)' },
  boss:    { r: 38, hp: 1500, spd: 55, xp: 200, col: '#76708a', label: 'The Warden' },
  dummy:   { r: 26, hp: 1e9,  spd: 0, xp: 0,  col: '#5d636e', label: 'dummy' }
};
function mkEnemy(t, x, y) { const d = ET[t]; return { t, x, y, r: d.r, hp: d.hp, maxhp: d.hp, state: 'move', st: 0, cd: 1 + Math.random(), slow: 0, flash: 0, pat: 0 }; }
function spawnWave(n) {
  const edge = () => { const s = Math.random() * 4 | 0, r = Math.random(); return s === 0 ? [r * W, 20] : s === 1 ? [r * W, H - 20] : s === 2 ? [20, r * H] : [W - 20, r * H]; };
  for (let i = 0; i < 2 + n; i++) enemies.push(mkEnemy('grunt', ...edge()));
  for (let i = 0; i < Math.floor(n / 2) + (n > 1 ? 1 : 0); i++) enemies.push(mkEnemy('spitter', ...edge()));
  if (n === 2 || n % 3 === 0) enemies.push(mkEnemy('elite', ...edge()));
}

// ---------- casting ----------
function aimAng() { return Math.atan2(mouse.y - P.y, mouse.x - P.x); }
function nearestEnemy(x, y, ex) { let b = null, bd = 1e9; for (const e of enemies) { if (e === ex || e.hp <= 0) continue; const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { bd = d; b = e; } } return b; }
function fire(a, x, y, ang, mult, isStage) {
  const b = BP[a.bp], st = stats(a), dmg = st.dmg * mult, sc = Math.min(1 + (mult - 1) * 0.6, 2.2);
  const angs = a.split ? [-0.22, 0, 0.22] : [0];
  if (b.kind === 'proj') {
    for (const g of angs) shots.push({ a, x, y, vx: Math.cos(ang + g) * b.speed, vy: Math.sin(ang + g) * b.speed, r: b.r * sc, dmg, life: b.life, stage: isStage, sc });
  } else if (b.kind === 'beam') {
    for (const g of angs) {
      const A = ang + (a.split ? g * 1.15 : 0), x2 = x + Math.cos(A) * b.len, y2 = y + Math.sin(A) * b.len, w = b.w * sc;
      fx.push({ k: 'beam', x, y, x2, y2, w, col: COL[a.el], t: 0.18, T: 0.18 });
      let first = null, ft = 2;
      for (const e of enemies) {
        if (e.hp <= 0 || segDist(e.x, e.y, x, y, x2, y2) > w / 2 + e.r) continue;
        hit(e, dmg, a.el);
        const tt = ((e.x - x) * (x2 - x) + (e.y - y) * (y2 - y)) / (b.len * b.len); if (tt < ft) { ft = tt; first = e; }
      }
      if (first && a.chain && !isStage) stage(a, first.x, first.y, mult, first);
    }
  } else if (b.kind === 'shield') {
    shields.push({ a, t: b.dur, offs: a.split ? [0, 2.094, 4.189] : [0], tick: 0, dmg, sc, base: ang });
  }
}
function stage(a, x, y, mult, exclude) {
  const sa = { bp: a.chainBp, el: a.el, level: a.level, split: false, charge: false, chain: false };
  const tg = nearestEnemy(x, y, exclude);
  const ang = tg ? Math.atan2(tg.y - y, tg.x - x) : Math.random() * 6.283;
  fire(sa, x, y, ang, mult * 0.7, true);
  fx.push({ k: 'ring', x, y, r: 6, R: 22, col: COL[a.el], t: 0.2, T: 0.2 });
}
function tryCast(i, mult) {
  const id = S.slots[i]; if (!id || cds[i] > 0) return false;
  const a = S.abilities.find(x => x.id === id), st = stats(a), cost = st.cost * (a.charge ? (0.6 + 0.4 * mult) : 1);
  if (P.en < cost) { nums.push({ x: P.x, y: P.y - 24, v: 'no energy', t: 0.5, col: '#8a93a3' }); cds[i] = 0.2; return false; }

// ---------- input ----------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (k === 'l') { const el = document.getElementById('tally'); el.style.display = el.style.display === 'block' ? 'none' : 'block'; renderTally(); return; }
  if (mode !== 'fight') return;
  keys[k] = true;
  if (k === 'f') { if (paused && P.hp <= 0) backToForge('death'); else backToForge(paused ? 'wave cleared' : 'retreat'); }
  if (k === 'c' && paused && fightMode === 'waves' && P.hp > 0) nextWave();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function toCanvas(e) { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
C.addEventListener('mousemove', e => { const p = toCanvas(e); mouse.x = p.x; mouse.y = p.y; });
C.addEventListener('mousedown', e => { if (e.button === 0) mouse.b[0] = true; if (e.button === 2) mouse.b[1] = true; });
addEventListener('mouseup', e => { if (e.button === 0) mouse.b[0] = false; if (e.button === 2) mouse.b[1] = false; });
C.addEventListener('contextmenu', e => e.preventDefault());
function fit() { const s = Math.min(innerWidth / W, innerHeight / H, 1.4); C.style.width = W * s + 'px'; C.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();

// ---------- loop ----------
let last = performance.now(), tallyTick = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'fight') { T.tFight += dt; if (!paused) update(dt); render(); } else T.tForge += dt;
  toastT -= dt; if (toastT <= 0) document.getElementById('toast').textContent = '';
  tallyTick -= dt; if (tallyTick <= 0) { tallyTick = 1; renderTally(); }
  requestAnimationFrame(loop);
}
tlog('SESSION START (starter ability: Energy Bolt)');
renderForge(); requestAnimationFrame(loop);
</script>
